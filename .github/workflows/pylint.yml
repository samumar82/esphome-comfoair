name: Pylint

on:
  push:
    paths:
      - "components/**/*.py"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "components/**/*.py"
      - ".github/workflows/pylint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pylint "esphome==2026.6.5"
      - name: Analyze Python component code
        run: pylint $(git ls-files '*.py')
